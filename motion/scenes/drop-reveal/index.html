<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STKD scene: drop reveal</title>
<link rel="stylesheet" href="../../../site/tokens.css">
<link rel="stylesheet" href="scene.css">
</head>
<body>
<div id="frame">
  <canvas id="grain"></canvas>
  <div id="glow"></div>

  <header id="caption">
    <div id="kicker">STKD <span>/</span> Drop 001</div>
    <h1 id="headline"></h1>
    <div id="price">
      <div id="was"><span>€66+ of products</span><i id="strike"></i></div>
      <div id="now">€49.90<small>/month</small></div>
      <div id="sub">8+ brands. No tubs. No commitment.</div>
    </div>
  </header>

  <div id="rows"></div>

  <div id="stage">
    <div id="shadow"></div>
    <div id="box">
      <div class="face" id="f-front"><span class="emboss">STKD</span><i class="sweep"></i></div>
      <div class="face" id="f-back"></div>
      <div class="face" id="f-left"></div>
      <div class="face" id="f-right"></div>
      <div class="face" id="f-inside"></div>
      <div id="hinge"><div class="face" id="f-lid"><span class="emboss">STKD</span><i class="sweep"></i></div></div>
    </div>
  </div>
  <div id="items"></div>
</div>
<script type="module" src="scene.js"></script>
</body>
</html>
